<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketFlow | Admin User CRUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="container topbar">
      <a class="brand" href="index.html">MarketFlow</a>
      <nav>
        <ul>
          <li><a href="index.html">Marketplace</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="register.html">Register</a></li>
          <li><a href="admin-products.html">Admin Products</a></li>
          <li><a class="active" href="admin-users.html">Admin Users</a></li>
          <li><a href="inventory-report.html">Inventory</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Admin User Management</h1>
    <p class="subtitle">Manage user accounts and access levels.</p>

    <section class="card">
      <h3>Create / Edit User</h3>
      <form>
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));">
          <div>
            <label for="user-name">Full Name</label>
            <input id="user-name" type="text" placeholder="Full name" />
          </div>
          <div>
            <label for="user-email">Email</label>
            <input id="user-email" type="email" placeholder="email@example.com" />
          </div>
          <div>
            <label for="role">Role</label>
            <select id="role">
              <option>Buyer</option>
              <option>Seller</option>
              <option>Admin</option>
            </select>
          </div>
        </div>
        <button class="btn btn--primary" type="submit">Save User</button>
      </form>
    </section>

    <section style="margin-top: 1rem;">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Sample Buyer</td>
            <td>buyer@marketflow.com</td>
            <td>Buyer</td>
            <td>Active</td>
            <td>
              <a class="btn btn-secondary" href="#">Edit</a>
              <a class="btn btn-danger" href="#">Delete</a>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
  <script src="api.js"></script>
  <script src="admin-users-page.js"></script>
</body>
</html>
