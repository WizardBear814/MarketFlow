<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketFlow | Admin Product CRUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="container topbar">
      <a class="brand" href="index.html">MarketFlow</a>
      <nav>
        <ul>
          <li><a href="index.html">Marketplace</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="register.html">Register</a></li>
          <li><a class="active" href="admin-products.html">Admin Products</a></li>
          <li><a href="admin-users.html">Admin Users</a></li>
          <li><a href="inventory-report.html">Inventory</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Admin Product Management</h1>
    <p class="subtitle">Create, edit, and remove product listings.</p>

    <section class="card">
      <h3>Create / Edit Product</h3>
      <form>
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));">
          <div>
            <label for="sku">SKU</label>
            <input id="sku" type="text" placeholder="SKU-001" />
          </div>
          <div>
            <label for="product-name">Name</label>
            <input id="product-name" type="text" placeholder="Product name" />
          </div>
          <div>
            <label for="price">Price</label>
            <input id="price" type="number" step="0.01" placeholder="0.00" />
          </div>
          <div>
            <label for="quantity">Quantity</label>
            <input id="quantity" type="number" placeholder="0" />
          </div>
        </div>
        <div>
          <label for="description">Description</label>
          <textarea id="description" rows="3" placeholder="Product details"></textarea>
        </div>
        <div>
          <button type="submit" class="btn btn--primary">Save Product</button>
          <button type="button" class="btn btn-secondary">Clear</button>
        </div>
      </form>
    </section>

    <section style="margin-top: 1rem;">
      <table>
        <thead>
          <tr>
            <th>SKU</th>
            <th>Name</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>SKU-001</td>
            <td>Wireless Headphones</td>
            <td>$89.99</td>
            <td>42</td>
            <td>
              <a class="btn btn-secondary" href="#">Edit</a>
              <a class="btn btn-danger" href="#">Delete</a>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
  <script src="api.js"></script>
  <script src="admin-products-page.js"></script>
</body>
</html>
