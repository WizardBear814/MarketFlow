<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketFlow | Marketplace</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="api.js" defer></script>
  <script src="index-page.js" defer></script>
</head>
<body>
  <header>
    <div class="container topbar">
      <a class="brand" href="index.html">MarketFlow</a>
      <nav>
        <ul></ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Shop Available Products</h1>
    <p class="subtitle">Browse products, compare prices, and add items to your cart.</p>

    <section id="quick-role-card" class="card" style="display:none" aria-label="Quick role switch">
      <h3>Quick Role Switch</h3>
      <p class="muted">Use this if admin links are hidden for your current account role.</p>
      <div>
        <button id="quick-role-buyer" type="button" class="btn btn-secondary">Buyer</button>
        <button id="quick-role-seller" type="button" class="btn btn-secondary">Seller</button>
        <button id="quick-role-admin" type="button" class="btn btn--primary">Admin</button>
      </div>
    </section>

    <section class="card" aria-label="Search products">
      <form>
        <div>
          <label for="search">Search products</label>
          <input id="search" type="text" placeholder="Search by name, SKU, or description" />
        </div>
      </form>
    </section>

    <section class="grid products-grid" aria-label="Product listing">
      <p class="muted">Loading products…</p>
    </section>
  </main>
</body>
</html>
