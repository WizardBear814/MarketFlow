<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketFlow | Cart</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="api.js" defer></script>
  <script src="cart-page.js" defer></script>
</head>
<body>
  <header>
    <div class="container topbar">
      <a class="brand" href="index.html">MarketFlow</a>
      <nav>
        <ul></ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Your Cart</h1>
    <p class="subtitle">Review your order, update quantities, and checkout.</p>

    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Subtotal</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="5" class="muted">Loading cart…</td></tr>
      </tbody>
    </table>

    <section class="card" style="margin-top: 1rem;">
      <h3>Order Summary</h3>
      <p class="muted">Loading…</p>
    </section>
  </main>
</body>
</html>
