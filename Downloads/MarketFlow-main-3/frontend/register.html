<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketFlow | Register</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="api.js" defer></script>
  <script src="register-page.js" defer></script>
</head>
<body>
  <header>
    <div class="container topbar">
      <a class="brand" href="index.html">MarketFlow</a>
      <nav>
        <ul></ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Create Account</h1>
    <p class="subtitle">Register to track your purchases and order history.</p>

    <section class="card" style="max-width: 560px;">
      <form>
        <div>
          <label for="full-name">Full Name</label>
          <input id="full-name" type="text" placeholder="Jane Doe" required />
        </div>
        <div>
          <label for="register-email">Email</label>
          <input id="register-email" type="email" placeholder="you@example.com" required />
        </div>
        <div>
          <label for="register-password">Password</label>
          <input id="register-password" type="password" placeholder="Create password (min 6 characters)" required />
        </div>
        <div>
          <label for="confirm-password">Confirm Password</label>
          <input id="confirm-password" type="password" placeholder="Re-enter password" required />
        </div>
        <button class="btn btn--primary" type="submit">Register</button>
      </form>
      <p class="muted" style="margin-top: 1rem; font-size: 0.85rem;">
        Already have an account? <a class="link" href="login.html">Login</a>
      </p>
    </section>
  </main>
</body>
</html>
