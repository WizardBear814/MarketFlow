<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketFlow | Admin Products</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="api.js" defer></script>
  <script src="admin-products-page.js" defer></script>
</head>
<body>
  <header>
    <div class="container topbar">
      <a class="brand" href="index.html">MarketFlow</a>
      <nav>
        <ul></ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Admin Product Management</h1>
    <p class="subtitle">Create, edit, and remove product listings.</p>

    <section class="card">
      <h3>Create / Edit Product</h3>
      <form>
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));">
          <div>
            <label for="sku">SKU</label>
            <input id="sku" type="text" placeholder="SKU-001" required />
          </div>
          <div>
            <label for="product-name">Name</label>
            <input id="product-name" type="text" placeholder="Product name" required />
          </div>
          <div>
            <label for="price">Price</label>
            <input id="price" type="number" step="0.01" placeholder="0.00" required />
          </div>
          <div>
            <label for="quantity">Quantity</label>
            <input id="quantity" type="number" placeholder="0" required />
          </div>
        </div>
        <div>
          <label for="description">Description</label>
          <textarea id="description" rows="3" placeholder="Product details"></textarea>
        </div>
        <div>
          <button type="submit" class="btn btn--primary">Save Product</button>
          <button type="button" class="btn btn-secondary">Clear</button>
        </div>
      </form>
    </section>

    <section style="margin-top: 1rem;">
      <table>
        <thead>
          <tr>
            <th>SKU</th>
            <th>Name</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="5" class="muted">Loading…</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
