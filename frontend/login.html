<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketFlow | Login</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="api.js" defer></script>
  <script src="login-page.js" defer></script>
</head>
<body>
  <header>
    <div class="container topbar">
      <a class="brand" href="index.html">MarketFlow</a>
      <nav>
        <ul></ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Login</h1>
    <p class="subtitle">Sign in to access your account and shop.</p>

    <section class="card" style="max-width: 480px;">
      <form>
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter password" required />
        </div>
        <button class="btn btn--primary" type="submit">Login</button>
      </form>
      <p class="muted" style="margin-top: 1rem; font-size: 0.85rem;">
        New here? <a class="link" href="register.html">Create an account</a>
      </p>
    </section>
  </main>
</body>
</html>
