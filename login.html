<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketFlow | Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="container topbar">
      <a class="brand" href="index.html">MarketFlow</a>
      <nav>
        <ul>
          <li><a href="index.html">Marketplace</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li><a class="active" href="login.html">Login</a></li>
          <li><a href="register.html">Register</a></li>
          <li><a href="admin-products.html">Admin Products</a></li>
          <li><a href="admin-users.html">Admin Users</a></li>
          <li><a href="inventory-report.html">Inventory</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Login</h1>
    <p class="subtitle">Sign in to access your account and purchase history.</p>

    <section class="card" style="max-width: 480px;">
      <form>
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter password" required />
        </div>
        <button class="btn btn--primary" type="submit">Login</button>
      </form>
    </section>
  </main>
  <script src="api.js"></script>
  <script src="login-page.js"></script>
</body>
</html>
